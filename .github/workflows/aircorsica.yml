name: Air Corsica scraping

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: self-hosted
    env:
      RUNNER_TOOL_CACHE: /Users/macbookairsalini/scraper_corse/actions-runner/_tool
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas lxml

      - name: Run scraper
        run: |
          python air_corsica.py
