name: Scrape Air Corsica 

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install requests beautifulsoup4 pandas lxml

      - name: Run scraper
        run: |
          python3 scraperapi.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add prix_aircorsica_*.csv historique_global.csv
          git diff --cached --quiet || git commit -m "Mise à jour automatique des prix Air Corsica"
          git push
