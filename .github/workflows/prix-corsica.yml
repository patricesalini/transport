name: Suivi mensuel des prix Air Corsica (46 liaisons) — secours manuel uniquement

on:
  workflow_dispatch:        # plus de déclenchement automatique, uniquement manuel

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests

      - name: Lancer le scraper
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scraper_aircorsica_api.py

      - name: Committer les nouveaux résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -d routes_aircorsica ] && git add routes_aircorsica/
          [ -f historique_global_france.csv ] && git add historique_global_france.csv
          [ -f historique_prix_google.csv ] && git add historique_prix_google.csv
          git diff --staged --quiet || git commit -m "Mise à jour manuelle des prix ($(date +%Y-%m-%d))"
          git push
